<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olist E-commerce Tableau Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
      background-color: #f7f7f7;
      color: #222;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 50px;
      margin-bottom: 12px;
    }

    .tableauPlaceholder {
      position: relative;
      width: 100%;
      margin-bottom: 40px;
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .tableauViz {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Olist E-commerce Performance Dashboard</h1>
  <p>This page hosts my Tableau dashboards on GitHub Pages.</p>

  <h2>Full Dashboard Overview</h2>
  <div class="tableauPlaceholder" id="viz-full-dashboard">
    <noscript>
      <a href="#">
        <img alt="Revenue Trends and Category Performance Dashboard"
          src="https://public.tableau.com/static/images/Re/RevenueTrendsandCategoryPerformanceDashboard/RevenueTrendsandCategoryPerformanceDashboard/1_rss.png"
          style="border: none" />
      </a>
    </noscript>
    <object class="tableauViz">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="RevenueTrendsandCategoryPerformanceDashboard/RevenueTrendsandCategoryPerformanceDashboard" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image" value="https://public.tableau.com/static/images/Re/RevenueTrendsandCategoryPerformanceDashboard/RevenueTrendsandCategoryPerformanceDashboard/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-GB" />
    </object>
  </div>

  <h2>Category Leaderboard</h2>
  <div class="tableauPlaceholder" id="viz-category-leaderboard">
    <noscript>
      <a href="#">
        <img alt="Category leaderboard (top 10)"
          src="https://public.tableau.com/static/images/Ol/OlisCategoryleaderboardtop10/Categoryleaderboardtop10/1_rss.png"
          style="border: none" />
      </a>
    </noscript>
    <object class="tableauViz">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="OlisCategoryleaderboardtop10/Categoryleaderboardtop10" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image" value="https://public.tableau.com/static/images/Ol/OlisCategoryleaderboardtop10/Categoryleaderboardtop10/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-GB" />
      <param name="filter" value="publish=yes" />
    </object>
  </div>

  <h2>Category Revenue Distribution by Month</h2>
  <div class="tableauPlaceholder" id="viz-revenue-distribution">
    <noscript>
      <a href="#">
        <img alt="Category Revenue Distribution by Month"
          src="https://public.tableau.com/static/images/Ol/OlisCategoryRevenueDistributionbyMonth/CategoryRevenueDistributionbyMonth/1_rss.png"
          style="border: none" />
      </a>
    </noscript>
    <object class="tableauViz">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="OlisCategoryRevenueDistributionbyMonth/CategoryRevenueDistributionbyMonth" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image" value="https://public.tableau.com/static/images/Ol/OlisCategoryRevenueDistributionbyMonth/CategoryRevenueDistributionbyMonth/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-GB" />
      <param name="filter" value="publish=yes" />
    </object>
  </div>

  <h2>Monthly Trend Overview</h2>
  <div class="tableauPlaceholder" id="viz-monthly-trend">
    <noscript>
      <a href="#">
        <img alt="Monthly Trend (2)"
          src="https://public.tableau.com/static/images/Ol/OlisMonthlyTrendOverview/MonthlyTrend2/1_rss.png"
          style="border: none" />
      </a>
    </noscript>
    <object class="tableauViz">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="OlisMonthlyTrendOverview/MonthlyTrend2" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image" value="https://public.tableau.com/static/images/Ol/OlisMonthlyTrendOverview/MonthlyTrend2/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-GB" />
      <param name="filter" value="publish=yes" />
    </object>
  </div>

  <h2>Category Performance Over Time</h2>
  <div class="tableauPlaceholder" id="viz-category-performance-time">
    <noscript>
      <a href="#">
        <img alt="Category performance over time"
          src="https://public.tableau.com/static/images/Ol/OlisProductsCategoryPerformanc/Categoryperformanceovertime/1_rss.png"
          style="border: none" />
      </a>
    </noscript>
    <object class="tableauViz">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="OlisProductsCategoryPerformanc/Categoryperformanceovertime" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image" value="https://public.tableau.com/static/images/Ol/OlisProductsCategoryPerformanc/Categoryperformanceovertime/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-GB" />
      <param name="filter" value="publish=yes" />
    </object>
  </div>

  <script src="https://public.tableau.com/javascripts/api/viz_v1.js"></script>
  <script>
    const vizObjects = document.querySelectorAll(".tableauPlaceholder object");
    vizObjects.forEach((viz) => {
      viz.style.display = "block";
      viz.style.width = "100%";
      viz.style.height = "800px";
    });
  </script>
</body>
</html>
